versioning:
  scheme: none-published
  current_version: 'public'
  note: >-
    info.version on the OTP Management document is the literal string "public" — a document-flavour label
    distinguishing the public swagger group from the internal ones, not a version a client can pin to. Paths
    carry no version segment (/api/..., not /api/v1/...). The TP AI service declares version 0.1.0, the FastAPI
    scaffold default. Data Studio's runtime config points at a /api/v1 base, so at least one internal service
    does version its path, but that surface is not public.
  breaking_change_policy: none-published
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy, no notice period, no RFC 8594 Sunset/Deprecation headers, and no operation in either
    public spec carries `deprecated: true`. With only two public operations and no version segment, a breaking
    change would reach integrators without warning.
sla:
  published: false
  note: >-
    No public SLA document. The Terms of Service is a general SaaS agreement; availability commitments, if any,
    are contracted per customer.
