note: >-
  Aibidia publishes no plans, no tiers and no prices. Its complete sitemap (149 URLs, fetched 2026-09-13) contains
  no /pricing page; https://www.aibidia.com/pricing returns 404. Every commercial path on the site is a
  sales-qualification form — "Book a demo", "Talk to a TP expert", "Contact sales". The one product with a
  self-serve-looking entry point, TP Aurora, routes through /tp-aurora-trial and /contact-sales-tp-aurora, both
  of which are forms rather than a checkout, and TP Aurora signs in against a separate Azure AD B2C tenant
  (tpauroraprod.b2clogin.com) from the main platform. There is also a `pricing` article in the customer help
  centre (https://aibidia.my.site.com/help/article/pricing) but that portal renders client-side and serves no
  readable content to a crawler, so whatever it says is not publicly readable.
  This is an honest zero, not a gap in our search: enterprise transfer pricing software sold to multinational
  tax departments is priced by quote, and Aibidia has made no attempt to publish otherwise.
