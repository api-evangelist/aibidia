domain_standard:
  applicable_standards_considered:
  - OECD BEPS Action 13 Country-by-Country Report XML Schema
  - OECD Transfer Pricing Guidelines (master file / local file structure)
  - SAF-T (OECD Standard Audit File for Tax)
  - XBRL / Inline XBRL
  - ISO 20022
  declared: false
  conforms: false
  evidence: >-
    Checked the served contract itself, not marketing prose. The OTP Management schemas carry no namespace, no
    schema URN, no message-type identifier and no reference to any published tax or accounting standard. The
    48-value ExtractTypeColumn enum is Aibidia's own vocabulary — SAP-shaped in places (SoldToParty,
    BillingDocument, Incoterms, MaterialCode) and OECD-concept-shaped in others (TaxJurisdiction,
    TransferPriceMethod, markup) — but it is bilateral, not a standard. Aibidia's CbCR module demonstrably
    produces OECD CbC XML output for filing (the help centre carries a "Step 8: validate and convert your CbC
    data" article and CbC Table 1/Table 2 definition articles), but that conversion happens inside the product;
    no public contract declares it, so this is recorded as not-declared rather than as conformance.
  note: >-
    REWARD-ONLY check. Transfer pricing has a genuine cross-vendor standard available in the OECD CbCR XML
    schema, and a contract that declared it would let a customer's existing tax-reporting toolchain integrate
    without a bespoke connector. Aibidia does not declare it on the public surface. Nothing is invented here.
regulatory_regime:
  applicable: null
  note: >-
    The Kin Score's industry_regulatory map carries no tax / transfer pricing regime, so no conditional
    regulatory facet applies to this provider. The regimes that actually govern its customers — OECD BEPS
    Actions 8-10 and 13, EU DAC6/DAC7, Pillar Two GloBE, and each jurisdiction's local file rules — are the
    subject matter of the product, not a compliance obligation on its API.
additional_contracts_discovered:
  note: >-
    Recorded here so the probe result is not lost. Contract discovery walked every API host named in Aibidia's
    own published runtime configuration, not just the docs host, and found three more swagger surfaces beyond the
    two registered in apis.yml.
  surfaces:
