    url: https://hzn-api.aibidia.com/swagger/public/swagger.json
    status: 200
    result: >-
      A real published OpenAPI 3.1.1 document titled "Public Horizon API" with a servers[] block naming
      https://hzn-api.aibidia.com — and ZERO paths. The Swagger UI at /swagger/index.html renders an empty API.
      Saved verbatim at openapi/_original/aibidia-horizon-public-openapi.json as evidence, but deliberately NOT
      registered as an API in apis.yml and not refined: a contract that declares no operations describes no API,
      and pointing at it would credit Aibidia with a surface that does not exist. The most likely reading is a
      public swagger document group stood up ahead of the operations that will fill it.
  - host: datastudio-api.aibidia.com
    url: https://datastudio-api.aibidia.com/swagger/v1/swagger.json
    status: 401
    result: >-
      Swagger exists and is authentication-gated. Every swagger path on this host returns 401 rather than 404,
      which distinguishes "gated" from "absent". Not saved — a gated spec must not be guessed at.
  - host: otpm-api.aibidia.com
    url: https://otpm-api.aibidia.com/swagger/index.html
    status: 200
    result: >-
      Swagger UI whose config declares exactly one document group, named "Public OTP Management API". The
