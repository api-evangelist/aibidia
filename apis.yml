- name: Aibidia TP AI API
  image: https://cdn.prod.website-files.com/652d101c1d03208622e683de/65686f3212a45fa956dd35a9_Social%20Share%20Aibidia.png
  description: >-
    Backend service for the Aibidia TP AI solution surfaced at platform.aibidia.com/tpai/. It serves an OpenAPI
    3.1.0 document anonymously at https://tpai-api.aibidia.com/openapi.json describing a healthcheck, an
    authorization call and a chat-session creation call that takes a workspaceId and returns a hosted assistant
    session. The served document carries the FastAPI framework's default info.title; the service is identified as
    Aibidia's TP AI API by the provider's own published runtime configuration at
    https://platform.aibidia.com/tpai/env.js.
  humanURL: https://www.aibidia.com/platform
  baseURL: https://tpai-api.aibidia.com
