aid: aibidia
name: Aibidia
description: >-
  Aibidia is a Helsinki-based transfer pricing technology company whose cloud platform lets multinational
  enterprises manage transfer pricing policy, intercompany transaction data, documentation and country-by-country
  reporting in one place. The platform is delivered as a set of solution modules — TPDoc (documentation), CbCR,
  OTP Management, Strategic TP Management, Value Chain Analysis, Data Studio, Horizon and TP AI — behind a single
  Azure AD B2C sign-in at platform.aibidia.com, each backed by its own first-party API service on an aibidia.com
  subdomain. Aibidia publishes a small deliberately-public integration surface: the Public OTP Management API,
  which accepts automated multi-level segmentation data injections from a customer's ERP or finance stack using an
  X-DATAINGESTION-API-KEY header. There is no open developer portal, no public API reference and no self-serve
  signup; the platform is sold to enterprise tax teams and the help centre and release notes sit behind
  client-rendered portals.
