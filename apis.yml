apis:
- name: Aibidia Public OTP Management API
  image: https://cdn.prod.website-files.com/652d101c1d03208622e683de/65686f3212a45fa956dd35a9_Social%20Share%20Aibidia.png
  description: >-
    The deliberately-public integration surface of Aibidia's OTP Management solution. It accepts automated
    multi-level segmentation data injections for a given year, month and Extract Type, and returns the
    configuration and current upload status of the extracts bound to the calling API key. Authentication is an
    X-DATAINGESTION-API-KEY request header issued per Extract Type; errors are returned as RFC 7807
    ProblemDetails. The published document is served by the provider at
    https://otpm-api.aibidia.com/swagger/public/swagger.json and is titled "Public OTP Management API".
  humanURL: https://otpm-api.aibidia.com/swagger/index.html
  baseURL: https://otpm-api.aibidia.com
